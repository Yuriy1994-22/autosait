# Это инструкция для GitHub, как автоматически обновлять автомобили
name: Обновление данных об автомобилях

on:
  schedule:
    # Запускать каждые 6 часов (00:00, 06:00, 12:00, 18:00 по UTC)
    - cron: '0 */6 * * *'
  
  # Также запускать вручную кнопкой в GitHub
  workflow_dispatch:

jobs:
  update-cars:
    runs-on: ubuntu-latest  # Используем Linux сервер
    
    steps:
    # Шаг 1: Копируем наш код на сервер GitHub
    - name: Копируем код
      uses: actions/checkout@v3
    
    # Шаг 2: Устанавливаем Python
    - name: Устанавливаем Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    # Шаг 3: Устанавливаем нужные программы
    - name: Устанавливаем зависимости
      run: |
        cd scraper
        pip install -r requirements.txt
    
    # Шаг 4: Создаем папку для резервных копий
    - name: Создаем папки
      run: mkdir -p data/backup
    
    # Шаг 5: Запускаем нашу программу для сбора данных
    - name: Собираем данные об автомобилях
      run: |
        cd scraper
        python scraper.py
    
    # Шаг 6: Сохраняем изменения обратно в GitHub
    - name: Сохраняем изменения
      run: |
        git config --global user.name "GitHub Bot"
        git config --global user.email "bot@github.com"
        git add data/cars.json
        git commit -m "🤖 Автоматическое обновление списка автомобилей"
        git push